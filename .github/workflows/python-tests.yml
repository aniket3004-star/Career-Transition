name: Python validation tests

on:
  push:
    branches: [main, v2-calculation-foundation]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validation-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install optional V2 astronomy reference dependencies
        run: python -m pip install -r requirements-v2-astronomy.txt
      - name: Run validation tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python -m unittest -v test_cli
